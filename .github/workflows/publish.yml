name: CI & CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

  publish:
    name: Publish Package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.2.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish to NPM
        run: |
          CURRENT_VER=$(node -p "require('./package.json').version")
          if npm view react-native-inapp-inspector@$CURRENT_VER version >/dev/null 2>&1; then
            echo "Version $CURRENT_VER already exists on npmjs.org. Skipping NPM publish."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          __RELEASE_PUBLISHING__: '1'

      - name: Publish to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${{ secrets.GITHUB_TOKEN }}"
          npm pkg set name="@vengatmacuser/react-native-inapp-inspector"
          CURRENT_VER=$(node -p "require('./package.json').version")
          if npm view @vengatmacuser/react-native-inapp-inspector@$CURRENT_VER version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version $CURRENT_VER already exists on GitHub Packages. Skipping."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          __RELEASE_PUBLISHING__: '1'
